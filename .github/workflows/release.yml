name: Release

on:
  push:
    tags: ['v*']

# Read only by default; only the release job below is granted write access.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # See ci.yml: Directory.Build.targets already switches off Avalonia's build-time statistics; this repeats it.
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  package-macos:
    name: Package macOS (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          # Native AOT cannot cross-compile, so each architecture is built on a runner of that architecture.
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The tag is untrusted input: it goes through env, never straight into the script text.
      - name: Check the tag against the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "tag '$TAG' is not of the form v<major>.<minor>[.<patch>]" >&2
            exit 1
          fi
          version="$(dotnet msbuild src/Vigil/Vigil.csproj -getProperty:Version -nologo | tr -d '[:space:]')"
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match <Version> $version in Directory.Build.props" >&2
            exit 1
          fi

      - name: Package
        env:
          RID: ${{ matrix.rid }}
        run: scripts/package-macos.sh "$RID"

      # The zip, with Vigil.app and Vigil Tray.app side by side, is made by the script (ditto keeps the bundle structure,
      # permissions and the ad-hoc signatures intact, and the script verifies both after unpacking it). Its name is
      # Vigil-<version>-<rid>.zip, and the step above has checked that <version> is the tag.
      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/Vigil-*-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 7

  package-windows:
    name: Package Windows (${{ matrix.rid }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        # Native AOT cannot cross-compile between operating systems, but on Windows it can between x64 and arm64 when
        # the C++ build tools of the target architecture are installed, which the windows-2025 image has (see ci.yml).
        rid: [win-x64, win-arm64]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The tag is untrusted input: it goes through env, never straight into the script text.
      - name: Check the tag against the project version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "tag '$TAG' is not of the form v<major>.<minor>[.<patch>]" >&2
            exit 1
          fi
          version="$(dotnet msbuild src/Vigil/Vigil.csproj -getProperty:Version -nologo | tr -d '[:space:]')"
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match <Version> $version in Directory.Build.props" >&2
            exit 1
          fi

      - name: Package
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: scripts/package-windows.ps1 $env:RID

      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/Vigil-*-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 7

  package-linux:
    name: Package Linux (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          # Each architecture is built on a runner of that architecture; see ci.yml for why linux-arm64 is not cross-compiled.
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The tag is untrusted input: it goes through env, never straight into the script text.
      - name: Check the tag against the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "tag '$TAG' is not of the form v<major>.<minor>[.<patch>]" >&2
            exit 1
          fi
          version="$(dotnet msbuild src/Vigil/Vigil.csproj -getProperty:Version -nologo | tr -d '[:space:]')"
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match <Version> $version in Directory.Build.props" >&2
            exit 1
          fi

      - name: Install the Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Package
        env:
          RID: ${{ matrix.rid }}
        run: scripts/package-linux.sh "$RID"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/Vigil-*-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create the GitHub Release
    needs: [package-macos, package-windows, package-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          sha256sum Vigil-*-osx-x64.zip Vigil-*-osx-arm64.zip Vigil-*-win-x64.zip Vigil-*-win-arm64.zip Vigil-*-linux-x64.tar.gz Vigil-*-linux-arm64.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # The release is created from the tag that triggered this run; --verify-tag makes gh fail if the tag is missing.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          Vigil ${TAG#v}: macOS, Windows and Linux, unsigned.

          - macOS: ad-hoc signed builds, no Developer ID signature and no Apple notarization. Use \`osx-arm64\` for Apple silicon and \`osx-x64\` for Intel. The Apple silicon build has not been tested on hardware. The zip holds \`Vigil.app\` (the daemon and the CLI) and \`Vigil Tray.app\` (the menu bar icon and settings window).
          - Windows: unsigned programs, so SmartScreen may warn. Use \`win-x64\` for Intel and AMD, \`win-arm64\` for Arm. These builds compile and pass their unit tests in CI but have not been verified on a real Windows machine yet. The arm64 build is cross-compiled and has not been run anywhere.
          - Linux: \`linux-x64\` and \`linux-arm64\` tarballs (Native AOT, glibc). They build and pass their unit tests in CI, and CI starts the binary once on a headless runner, where it reports the missing desktop cleanly, but they have not been verified on a real X11 or Wayland desktop yet. Wayland needs GNOME (the only compositor Vigil can read the idle time from) and a one-time consent with \`vigil permissions request\`; X11 needs libX11, libXss and libXtst.
          - Tray: every package contains the tray (menu bar icon on macOS, notification area on Windows, StatusNotifierItem on Linux, which GNOME shows only with the AppIndicator extension). It is built and its packaging is checked in CI, but nobody has verified it on a real desktop of any of the three systems yet. Vigil never starts it by itself (see the README).
          - Check the SHA-256 of the file you downloaded against its line in \`SHA256SUMS\` (macOS: \`shasum -a 256 <file>\`, Linux: \`sha256sum -c --ignore-missing SHA256SUMS\`, Windows PowerShell: \`Get-FileHash <file>\`).

          How to install: see [Install on macOS](https://github.com/${REPO}/blob/${TAG}/README.md#install-on-macos), [Install on Windows](https://github.com/${REPO}/blob/${TAG}/README.md#install-on-windows) or [Install on Linux](https://github.com/${REPO}/blob/${TAG}/README.md#install-on-linux).
          On macOS every new build has a new ad-hoc signature, so the Accessibility permission has to be granted again after an update.
          NOTES
          gh release create "$TAG" dist/Vigil-*.zip dist/Vigil-*.tar.gz dist/SHA256SUMS \
            --repo "$REPO" \
            --verify-tag \
            --title "Vigil ${TAG#v}" \
            --notes-file notes.md
