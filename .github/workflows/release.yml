name: Release

on:
  push:
    tags: ['v*']

# Read only by default; only the release job below is granted write access.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  package-macos:
    name: Package macOS (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          # Native AOT cannot cross-compile, so each architecture is built on a runner of that architecture.
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The tag is untrusted input: it goes through env, never straight into the script text.
      - name: Check the tag against the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "tag '$TAG' is not of the form v<major>.<minor>[.<patch>]" >&2
            exit 1
          fi
          version="$(dotnet msbuild src/Vigil/Vigil.csproj -getProperty:Version -nologo | tr -d '[:space:]')"
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match <Version> $version in src/Vigil/Vigil.csproj" >&2
            exit 1
          fi

      - name: Package
        env:
          RID: ${{ matrix.rid }}
        run: scripts/package-macos.sh "$RID"

      # ditto keeps the bundle structure, permissions and the ad-hoc signature intact.
      - name: Zip the app
        env:
          RID: ${{ matrix.rid }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "artifacts/$RID/Vigil.app" "Vigil-${TAG#v}-$RID.zip"
          ls -l "Vigil-${TAG#v}-$RID.zip"

      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.rid }}
          path: Vigil-*-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create the GitHub Release
    needs: package-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          sha256sum Vigil-*-osx-x64.zip Vigil-*-osx-arm64.zip > SHA256SUMS
          cat SHA256SUMS

      # The release is created from the tag that triggered this run; --verify-tag makes gh fail if the tag is missing.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          Vigil ${TAG#v}: macOS only, unsigned.

          - These are ad-hoc signed builds: there is no Developer ID signature and no Apple notarization.
          - macOS only. Windows and Linux are not supported yet.
          - Use the zip that matches your Mac: \`osx-arm64\` for Apple silicon, \`osx-x64\` for Intel. The Apple silicon build has not been tested on hardware.
          - Verify the download against \`SHA256SUMS\` (\`shasum -a 256 -c SHA256SUMS\`).

          How to install: see [Install on macOS](https://github.com/${REPO}/blob/${TAG}/README.md#install-on-macos).
          Every new build has a new ad-hoc signature, so the Accessibility permission has to be granted again after an update.
          NOTES
          gh release create "$TAG" dist/Vigil-*.zip dist/SHA256SUMS \
            --repo "$REPO" \
            --verify-tag \
            --title "Vigil ${TAG#v}" \
            --notes-file notes.md
