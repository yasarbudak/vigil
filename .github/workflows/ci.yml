name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository. No job here needs more.
permissions:
  contents: read

# A newer run on the same ref makes an older, still running one pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # Avalonia (the tray) documents only this variable as the opt-out of its build-time statistics. Directory.Build.targets already
  # switches the statistics task off for every build whatever the environment is; this repeats it for any tool that reads it.
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pinned image labels: -latest moves to a new OS version without a change in this repository.
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Vigil.slnx -c Release

      # global.json selects Microsoft.Testing.Platform, which needs the explicit --solution form.
      - name: Test
        run: dotnet test --solution Vigil.slnx -c Release --no-build

  package-macos:
    name: Package macOS (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native AOT cannot cross-compile, so each architecture is built on a runner of that architecture.
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Package
        env:
          RID: ${{ matrix.rid }}
        run: scripts/package-macos.sh "$RID"

      # The two signatures are checked by the script (also inside the unpacked zip). Here only what must never change is pinned,
      # and nothing is started: the permission and `open -n -o ... Vigil.app --args diag` depend on CFBundleExecutable of
      # Vigil.app being vigil, and the tray bundle must hold its program next to the three native libraries.
      - name: Check the bundles (nothing is started)
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          out="artifacts/$RID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$out/Vigil.app/Contents/Info.plist")" = vigil
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$out/Vigil.app/Contents/Info.plist")" = io.github.yasarbudak.vigil
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$out/Vigil Tray.app/Contents/Info.plist")" = vigil-tray
          test -x "$out/Vigil Tray.app/Contents/MacOS/vigil-tray"
          for bundle in "Vigil.app" "Vigil Tray.app"; do
            test -s "$out/$bundle/Contents/Resources/LICENSE"
            test -s "$out/$bundle/Contents/Resources/THIRD-PARTY-NOTICES.txt"
          done
          test -f "$out/Vigil Tray.app/Contents/MacOS/libSkiaSharp.dylib"
          test -f "$out/Vigil Tray.app/Contents/MacOS/libAvaloniaNative.dylib"
          codesign --verify --strict "$out/Vigil.app"
          codesign --verify --strict --deep "$out/Vigil Tray.app"
          otool -L "$out/Vigil Tray.app/Contents/MacOS/vigil-tray"

      # archive: false uploads the zip as is, so the artifact is the zip itself and not a zip of a zip.
      # The zip holds Vigil.app and Vigil Tray.app side by side; scripts/package-macos.sh made it with ditto.
      - name: Upload the apps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/${{ matrix.rid }}/Vigil-*-${{ matrix.rid }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: Package Linux (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native AOT builds for the architecture it runs on here: cross-architecture on Linux needs a cross linker and the
          # target's C runtime and zlib objects, which the .NET documentation calls "not documented or guaranteed"
          # (https://learn.microsoft.com/en-us/dotnet/core/deploying/native-aot/cross-compile). GitHub offers a native Arm
          # runner, ubuntu-24.04-arm, free for public repositories
          # (https://docs.github.com/en/actions/reference/runners/github-hosted-runners), so each architecture gets its own.
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The prerequisites of Native AOT on Ubuntu (https://learn.microsoft.com/en-us/dotnet/core/deploying/native-aot/):
      # clang is in the runner image, zlib1g-dev is not listed there, so both are requested; apt skips what is installed.
      - name: Install the Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Package
        env:
          RID: ${{ matrix.rid }}
        run: scripts/package-linux.sh "$RID"

      # Starts the real Native AOT binary once, on both architectures (each runner is of its own). diag only reads: it
      # prints the platform, the configuration and the idle time, and posts nothing. A runner has no desktop, so with the
      # session variables removed it must report the missing session cleanly (exit 0, "unavailable") and not crash.
      # The data directory is pointed at the runner's temp folder.
      - name: Smoke test (read only, no desktop session)
        env:
          RID: ${{ matrix.rid }}
          VIGIL_DATA_DIR: ${{ runner.temp }}/vigil-smoke
        run: |
          set -euo pipefail
          output="$(env -u DISPLAY -u WAYLAND_DISPLAY -u XDG_SESSION_TYPE "artifacts/$RID/vigil" diag)"
          echo "$output"
          echo "$output" | grep -q '^Idle time: .*unavailable'
          echo "$output" | grep -q '^Session type: .*unknown'

      # The tray is only looked at here, never started: a runner has no desktop. It must be in the folder and in the tarball with the
      # two native libraries Avalonia loads from its own folder, and be an ELF program; the libraries it links to are listed.
      - name: Check the tray (not started)
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          tray="artifacts/$RID/tray"
          test -x "$tray/vigil-tray"
          test -f "$tray/libSkiaSharp.so"
          test -f "$tray/libHarfBuzzSharp.so"
          head -c 4 "$tray/vigil-tray" | grep -q 'ELF'
          objdump -p "$tray/vigil-tray" | grep NEEDED
          objdump -p "$tray/libSkiaSharp.so" | grep NEEDED
          listing="$(tar -tzf artifacts/$RID/Vigil-*-$RID.tar.gz)"
          echo "$listing"
          echo "$listing" | grep -qx 'Vigil/tray/vigil-tray'
          echo "$listing" | grep -qx 'Vigil/tray/libSkiaSharp.so'
          echo "$listing" | grep -qx 'Vigil/tray/libHarfBuzzSharp.so'
          echo "$listing" | grep -qx 'Vigil/LICENSE'
          echo "$listing" | grep -qx 'Vigil/THIRD-PARTY-NOTICES.txt'

      # archive: false uploads the tarball as is, so the artifact is the tarball itself and not a zip of it.
      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/${{ matrix.rid }}/Vigil-*-${{ matrix.rid }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  package-windows:
    name: Package Windows (${{ matrix.rid }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Native AOT cannot cross-compile between operating systems, but on Windows it can between x64 and arm64 as
        # long as the C++ build tools of the target architecture are installed
        # (https://learn.microsoft.com/en-us/dotnet/core/deploying/native-aot/cross-compile). The windows-2025 image
        # lists Microsoft.VisualStudio.Component.VC.Tools.ARM64 and .x86.x64
        # (https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md), so one runner
        # type builds both. An arm64 build cannot run on this x64 runner, so only win-x64 gets the smoke test below.
        rid: [win-x64, win-arm64]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Package
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: scripts/package-windows.ps1 $env:RID

      # Starts the real Native AOT binaries once. Both commands only read: diag prints the platform, idle time and
      # configuration, permissions request says nothing is needed on Windows. Nothing is posted, installed or written
      # to the registry, and the data directory is pointed at the runner's temp folder.
      - name: Smoke test the x64 build (read only)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          VIGIL_DATA_DIR: ${{ runner.temp }}\vigil-smoke
        run: |
          $ErrorActionPreference = 'Stop'
          & artifacts/win-x64/vigil.exe diag
          if ($LASTEXITCODE -ne 0) { throw "vigil diag exited with $LASTEXITCODE" }
          & artifacts/win-x64/vigil.exe permissions request
          if ($LASTEXITCODE -ne 0) { throw "vigil permissions request exited with $LASTEXITCODE" }

      # The tray is only looked up in the zip, never started: the script has already checked that vigil-tray.exe has the GUI
      # subsystem, and a runner has no desktop.
      - name: Check the tray in the zip (not started)
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $path = (Get-ChildItem "artifacts/$env:RID/Vigil-*-$env:RID.zip").FullName
          $zip = [System.IO.Compression.ZipFile]::OpenRead($path)
          try { $names = @($zip.Entries | ForEach-Object { $_.FullName }) } finally { $zip.Dispose() }
          $names
          foreach ($required in @('Vigil/vigil.exe', 'Vigil/vigild.exe', 'Vigil/tray/vigil-tray.exe', 'Vigil/tray/libSkiaSharp.dll', 'Vigil/tray/libHarfBuzzSharp.dll', 'Vigil/LICENSE', 'Vigil/THIRD-PARTY-NOTICES.txt')) {
            if ($names -notcontains $required) { throw "the zip has no $required" }
          }

      # archive: false uploads the zip as is, so the artifact is the zip itself and not a zip of a zip.
      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/${{ matrix.rid }}/Vigil-*-${{ matrix.rid }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
